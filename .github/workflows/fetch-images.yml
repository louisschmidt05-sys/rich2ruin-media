name: Fetch archive images

on:
  workflow_dispatch:
  push:
    paths:
      - images.json
      - scripts/fetch_images.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_images.py
      - name: Commit new images
        run: |
          git config user.name "rich2ruin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add credits.json
          if [ -d images ]; then git add images; fi
          git diff --cached --quiet || git commit -m "Fetch public-domain archive images"
          git push

name: Fetch archive images

on:
  workflow_dispatch:
  push:
    paths:
      - images.json
      - scripts/fetch_images.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install requests pillow
      - run: python scripts/fetch_images.py
      - name: Commit new images
        run: |
          git config user.name "rich2ruin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add credits.json fetch_log.txt
          if [ -d previews ]; then git add previews; fi
          if [ -d images ]; then git add images; fi
          git diff --cached --quiet || git commit -m "Fetch public-domain archive images"
          git pull --rebase
          git push
